{{- if .Values.fluentbitSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-sidecar-config
  namespace: {{ .Values.namespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name          tail
        Path          /app/logs/combined/*.log
        Tag           testspace.combined
        Parser        json_log
        Refresh_Interval 5

    [INPUT]
        Name          tail
        Path          /app/logs/error/*.log
        Tag           testspace.error
        Parser        json_log
        Refresh_Interval 5

    [INPUT]
        Name          tail
        Path          /app/logs/requests/*.log
        Tag           testspace.requests
        Refresh_Interval 5

    [FILTER]
        Name          record_modifier
        Match         *
        Record        app test-space
        Record        log_source file

    [OUTPUT]
        Name              es
        Match             *
        Host              {{ .Values.fluentbitSidecar.elasticsearch.host }}
        Port              {{ .Values.fluentbitSidecar.elasticsearch.port }}
        HTTP_User         {{ .Values.fluentbitSidecar.elasticsearch.user }}
        HTTP_Passwd       {{ .Values.fluentbitSidecar.elasticsearch.password }}
        tls               On
        tls.verify        Off
        Logstash_Format   On
        Logstash_Prefix   {{ .Values.fluentbitSidecar.elasticsearch.index }}
        Suppress_Type_Name On

  parsers.conf: |
    [PARSER]
        Name        json_log
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%d %H:%M:%S
{{- end }}