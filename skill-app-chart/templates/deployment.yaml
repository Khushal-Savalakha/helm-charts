apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skill-app-chart.fullname" . }}
  labels:
    {{- include "skill-app-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "skill-app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "skill-app-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skill-app-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.uploads.enabled }}
            - name: shared-storage
              mountPath: {{ .Values.persistence.uploads.mountPath }}
              {{- if .Values.persistence.uploads.subPath }}
              subPath: {{ .Values.persistence.uploads.subPath }}
              {{- end }}
            {{- end }}
            {{- if .Values.persistence.staticfiles.enabled }}
            - name: shared-storage
              mountPath: {{ .Values.persistence.staticfiles.mountPath }}
              {{- if .Values.persistence.staticfiles.subPath }}
              subPath: {{ .Values.persistence.staticfiles.subPath }}
              {{- end }}
            {{- end }}
            {{- if .Values.persistence.media.enabled }}
            - name: shared-storage
              mountPath: {{ .Values.persistence.media.mountPath }}
              {{- if .Values.persistence.media.subPath }}
              subPath: {{ .Values.persistence.media.subPath }}
              {{- end }}
            {{- end }}
            # ── ADD: mount shared log volume ──────────────
            {{- if .Values.logVolume.enabled }}
            - name: app-logs
              mountPath: {{ .Values.logVolume.mountPath }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: skill-app-media-pvc
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}